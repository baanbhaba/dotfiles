# -----------------------------------------------------
# HYPRLOCK - CHARCOAL (AMBER CRT RETRO-TERMINAL THEME)
# -----------------------------------------------------

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = false
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = fadeIn,1,5,easeOutQuint
    animation = fadeOut,1,5,linear
    animation = inputFieldDots,1,4,easeOutQuint
}

# CRT Glass Blur Screenshot Background
background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 6
    noise = 0.02
    contrast = 0.90
    brightness = 0.70
    vibrancy = 0.20
    color = rgba(0a0806ff)
}

# Top Header Label: CRT Terminal Session Banner
label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##7a5000' font_weight='bold'>[ SESSION // TTY1 — UNIDENTIFIED ]</span>"
    color = rgb(ffb000)
    font_size = 13
    font_family = $font
    position = 0, 240
    halign = center
    valign = center
}

# Main Time: Big Amber Glow Display
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = rgb(ffb000)
    font_size = 80
    font_family = $font
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(ffb00066)
    shadow_boost = 1.2
    position = 0, 150
    halign = center
    valign = center
}

# Date & Day Label
label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##d6fff8'>$(date +'%A, %d %B %Y')</span>"
    color = rgb(00f5d4)
    font_size = 14
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

# System Status Subtext
label {
    monitor =
    text = cmd[update:5000] echo "<span foreground='##7a5000' font_size='10pt' font_family='JetBrainsMono Nerd Font'>STATUS: LOCKED  ·  VRAM: OPTIMAL  ·  VIBES: UNSPECIFIED</span>"
    color = rgb(7a5000)
    font_size = 11
    font_family = $font
    position = 0, 35
    halign = center
    valign = center
}

# Input Field: CRT Amber Password Container
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2

    outer_color = rgb(ffb000)
    inner_color = rgba(0a0806dd)

    font_color = rgb(fff2d6)
    font_family = $font
    placeholder_text = <span foreground="##7a5000" font_style="italic">> enter passcode...</span>
    
    dots_size = 0.28
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = 0

    fade_on_empty = false
    rounding = 8

    check_color = rgb(00f5d4)
    fail_color = rgb(ff3366)
    fail_text = <span foreground="##ff3366" font_weight="bold">SIGNAL REJECTED ($ATTEMPTS)</span>
    fail_transition = 200

    position = 0, -45
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(ffb00033)
}

# Footer Battery / Telemetry Info
label {
    monitor =
    text = cmd[update:5000] echo "<span foreground='##483c7d'>▲▲▲ [AUTHENTICATION REQUIRED // STANDBY] ▲▲▲</span>"
    color = rgb(a89ff9)
    font_size = 11
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}
