# -----------------------------------------------------
# HYPRLOCK - CHARCOAL (CALIBRATED MINIMAL + CAT)
# -----------------------------------------------------

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = fadeIn,1,4,easeOutQuint
    animation = fadeOut,1,4,linear
    animation = inputFieldDots,1,3,easeOutQuint
}

# Dark screenshot blur
background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.88
    brightness = 0.60
    vibrancy = 0.15
    color = rgba(050403ff)
}

# 1. Clean Time (1-Line Large Amber Display)
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = rgb(ffb000)
    font_size = 72
    font_family = $font
    font_weight = bold
    shadow_passes = 1
    shadow_size = 8
    shadow_color = rgba(ffb00044)
    position = 0, 160
    halign = center
    valign = center
}

# 2. Clean Date (Dim Amber)
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgb(996b1f)
    font_size = 14
    font_family = $font
    position = 0, 95
    halign = center
    valign = center
}

# 3. High-Definition 3-Line Animated Cat (Never Overlaps)
label {
    monitor =
    text = cmd[update:2000] bash -c 's=$(( $(date +%s) % 6 )); case $s in 0) printf " /\\_/\\\n( o.o )\n > ^ <  *peek*" ;; 1) printf " /\\_/\\\n( -.- )\n (___)3  *purr*" ;; 2) printf " /\\_/\\\n(=^.^=)\n (___)3  *meow*" ;; 3) printf " /\\_/\\\n( .o. )\n > ^ <  *sniff*" ;; 4) printf " /\\_/\\\n( --. )\n (___)3  zzZ" ;; 5) printf " /\\_/\\\n( o.o )\n > ~ <  *blink*" ;; esac'
    color = rgb(ffb000)
    font_size = 15
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

# 4. Sleek Floating Input Field
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1

    outer_color = rgb(ffb000)
    inner_color = rgba(0a0806ee)

    font_color = rgb(fff2d6)
    font_family = $font
    placeholder_text = 
    
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true

    fade_on_empty = false
    rounding = 6

    check_color = rgb(00f5d4)
    fail_color = rgb(ff3366)
    fail_text = <i>*hiss*</i>
    fail_transition = 150

    position = 0, -125
    halign = center
    valign = center
}
