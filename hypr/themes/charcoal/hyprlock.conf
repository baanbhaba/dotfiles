# -----------------------------------------------------
# HYPRLOCK - CHARCOAL (MINIMAL AMBER)
# -----------------------------------------------------

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = fadeIn,1,4,easeOutQuint
    animation = fadeOut,1,4,linear
    animation = inputFieldDots,1,3,easeOutQuint
}

# Dark screenshot blur
background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 7
    noise = 0.015
    contrast = 0.88
    brightness = 0.65
    vibrancy = 0.15
    color = rgba(0a0806ff)
}

# Clean Time Display
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = rgb(ffb000)
    font_size = 76
    font_family = $font
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(ffb00044)
    position = 0, 90
    halign = center
    valign = center
}

# Minimal Date
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgb(996b1f)
    font_size = 14
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

# Minimal Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1

    outer_color = rgb(ffb000)
    inner_color = rgba(0a0806cc)

    font_color = rgb(fff2d6)
    font_family = $font
    placeholder_text = 
    
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true

    fade_on_empty = false
    rounding = 6

    check_color = rgb(ffb000)
    fail_color = rgb(ff3366)
    fail_text = <i>incorrect</i>
    fail_transition = 150

    position = 0, -45
    halign = center
    valign = center
}
