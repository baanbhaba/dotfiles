# -----------------------------------------------------
# HYPRLOCK - CHARCOAL (MINIMAL + ANIMATED CAT)
# -----------------------------------------------------

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = fadeIn,1,4,easeOutQuint
    animation = fadeOut,1,4,linear
    animation = inputFieldDots,1,3,easeOutQuint
}

# Heavy moody dark blur
background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.10
    color = rgba(050403ff)
}

# Giant Minimal Stacked Hours
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgb(ffb000)
    font_size = 130
    font_family = $font
    font_weight = 900
    shadow_passes = 1
    shadow_size = 10
    shadow_color = rgba(ffb00033)
    position = 0, 175
    halign = center
    valign = center
}

# Giant Minimal Stacked Minutes
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgb(4a3300)
    font_size = 130
    font_family = $font
    font_weight = 900
    position = 0, 35
    halign = center
    valign = center
}

# The Roaming / Loafing / Sleeping Cat Animation (Changes state every 2 seconds)
label {
    monitor =
    text = cmd[update:2000] bash -c 's=$(( $(date +%s) % 8 )); case $s in 0) echo " /\\_/\\   ~ meow" ;; 1) echo "( o.o )  ." ;; 2) echo " > ^ <  .." ;; 3) echo " /\\_/\\  ..." ;; 4) echo "(=^-^=)  zzZ" ;; 5) echo "( -.- )   zZ" ;; 6) echo "(  -- )    Z" ;; 7) echo " (___)3  *purr*" ;; esac'
    color = rgb(ffb000)
    font_size = 14
    font_family = $font
    font_weight = bold
    position = 0, -85
    halign = center
    valign = center
}

# Sleek Floating Input Bar
input-field {
    monitor =
    size = 240, 42
    outline_thickness = 1

    outer_color = rgb(ffb000)
    inner_color = rgba(0a0806ee)

    font_color = rgb(fff2d6)
    font_family = $font
    placeholder_text = 
    
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true

    fade_on_empty = false
    rounding = 4

    check_color = rgb(00f5d4)
    fail_color = rgb(ff3366)
    fail_text = <i>*hiss*</i>
    fail_transition = 150

    position = 0, -145
    halign = center
    valign = center
}
