# -----------------------------------------------------
# MONITORS
# -----------------------------------------------------
monitor=,highrr,auto,1

# -----------------------------------------------------
# PROGRAMS & CONSTANTS
# -----------------------------------------------------
$terminal    = kitty
$fileManager = dolphin
$menu        = rofi -show drun -theme ~/.config/rofi/config.rasi
$run         = rofi -show run -theme ~/.config/rofi/config.rasi
$powermenu   = ~/.config/rofi/powermenu.sh
$mainMod     = SUPER

# -----------------------------------------------------
# AUTOSTART
# -----------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = ~/.config/mako/battery-check.sh &
exec-once = systemctl --user start hyprpolkitagent
exec-once = mako &
exec-once = waybar &
exec-once = swayosd-server &
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = ~/.config/hypr/scripts/battery_check.sh &

# -----------------------------------------------------
# INPUT & GESTURES
# -----------------------------------------------------
device {
    name = synps/2-synaptics-touchpad
    sensitivity = -0.1
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = -0.7

    touchpad {
        tap-to-click = true
        natural_scroll = true
    }
}

# -----------------------------------------------------
# GENERAL LAYOUT (ColorBlock: Soft Minimalist Pastel)
# -----------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgb(c4a35a) rgb(a89ab5) 45deg
    col.inactive_border = rgba(168, 154, 181, 0.4)
    layout = dwindle
    allow_tearing = false
}

# -----------------------------------------------------
# DECORATION & EFFECTS (14px Rounding & Soft Glow Shadow)
# -----------------------------------------------------
decoration {
    rounding = 14
    active_opacity = 0.98
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(168, 154, 181, 0.25)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
}

# -----------------------------------------------------
# ANIMATIONS
# -----------------------------------------------------
animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    
    animation = windows, 1, 4, smooth, slide
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, smooth, slide
}

# -----------------------------------------------------
# WINDOW RULES (v0.55+ Syntax)
# -----------------------------------------------------
windowrule {
    name = system_popups
    match:class = ^(nm-connection-editor|org.pulseaudio.pavucontrol|blueman-manager|pavucontrol)$
    float = true
    pin = true
    size = 400 500
    move = cursor -200 -250
}

# -----------------------------------------------------
# KEYBINDINGS - APPLICATIONS & ACTIONS
# -----------------------------------------------------
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, ~/.config/hypr/scripts/powermenu.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen,
bind = $mainMod, ESCAPE, exec, $menu
bind = $mainMod, R, exec, $run
bind = $mainMod, Z, fullscreenstate, 0, 1
bind = $mainMod, X, exec, ~/.local/bin/toggle-invert

# -----------------------------------------------------
# KEYBINDINGS - WINDOW & WORKSPACE NAVIGATION
# -----------------------------------------------------
# Focus Navigation
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Window Movement
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspace Switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hardware Controls
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S').png

# Misc Keybindings
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/theme_switcher.sh

# -----------------------------------------------------
# MISC, DEBUG & LAYOUT SETTINGS
# -----------------------------------------------------
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = 0xf0ebe3
    disable_splash_rendering = true
}

debug {
    vfr = true
}

dwindle {
    preserve_split = true
}
