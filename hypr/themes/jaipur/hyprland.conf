# -----------------------------------------------------
# JAIPUR HYPRLAND (WARM ROYAL TERRACOTTA & CRIMSON GLASS)
# -----------------------------------------------------
monitor=,highrr,auto,1

$terminal    = kitty
$fileManager = dolphin
$menu        = rofi -show drun -theme ~/.config/rofi/config.rasi
$run         = rofi -show run -theme ~/.config/rofi/config.rasi
$powermenu   = ~/.config/rofi/powermenu.sh
$mainMod     = SUPER

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = ~/.config/mako/battery-check.sh &
exec-once = systemctl --user start hyprpolkitagent
exec-once = mako &
exec-once = waybar &
exec-once = swayosd-server &
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = ~/.config/hypr/scripts/battery_check.sh &

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = -0.7
    touchpad {
        tap-to-click = true
        natural_scroll = true
    }
}

# Royal Terracotta and Gold 2px Borders
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(c45a3c) rgb(d4a847) 45deg
    col.inactive_border = rgba(196, 90, 60, 0.25)
    layout = dwindle
}

decoration {
    rounding = 6
    active_opacity = 0.95
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 14
        render_power = 2
        color = rgba(196, 90, 60, 0.35)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = jaipur, 0.22, 1, 0.36, 1
    animation = windows, 1, 3, jaipur
    animation = windowsOut, 1, 3, default, popin 70%
    animation = border, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, jaipur, slide
}

# Bindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, $menu
bind = $mainMod, R, exec, $run
bind = $mainMod, Escape, exec, $powermenu
bind = $mainMod, T, exec, ~/.config/hypr/scripts/theme_switcher.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
