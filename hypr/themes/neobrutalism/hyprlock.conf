# ╔══════════════════════════════════════════════════╗
# ║        HYPRLOCK - NEO-BRUTALISM + POP CAT        ║
# ║           🐱 maximum pop cat energy 🐱           ║
# ╚══════════════════════════════════════════════════╝

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = fadeIn,1,5,easeOutQuint
    animation = fadeOut,1,3,linear
    animation = inputFieldDots,1,2,easeOutQuint
}

# ─── BACKGROUND ───────────────────────────────────────────────────────────────
background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 1.05
    brightness = 0.92
    vibrancy = 0.25
    color = rgba(fffdf0ff)
}

# ─── TIME ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(000000)
    font_size = 92
    font_family = Nunito
    font_weight = 900
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000040)
    shadow_boost = 1.2
    position = 0, 210
    halign = center
    valign = center
}

# ─── DATE ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"  %A  ·  %d %B"
    color = rgb(ff006e)
    font_size = 15
    font_family = Nunito
    font_weight = 700
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(ff006e30)
    position = 0, 135
    halign = center
    valign = center
}

# ─── CAT LINE 1: ears ─────────────────────────────────────────────────────────
label {
    monitor =
    text =   /\_/\  
    color = rgb(000000)
    font_size = 22
    font_family = $font
    font_weight = bold
    shadow_passes = 1
    shadow_size = 8
    shadow_color = rgba(00000030)
    shadow_boost = 1.1
    position = 0, 72
    halign = center
    valign = center
}

# ─── CAT LINE 2: face (normal cycle / angry on fail) ─────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash -c 'if [ $ATTEMPTS -gt 0 ]; then f=$(( ($(date +%s%3N) / 2000) % 3 )); case $f in 0) echo " ( >:< )" ;; 1) echo " ( x_x )" ;; 2) echo " ( oo )" ;; esac; else f=$(( ($(date +%s%3N) / 2000) % 6 )); case $f in 0) echo " ( o.o )" ;; 1) echo " ( -.- )" ;; 2) echo " ( ^.^ )" ;; 3) echo " ( >w< )" ;; 4) echo " ( >.< )" ;; 5) echo " ( OwO )" ;; esac; fi'
    color = rgb(000000)
    font_size = 22
    font_family = $font
    font_weight = bold
    shadow_passes = 1
    shadow_size = 8
    shadow_color = rgba(00000030)
    shadow_boost = 1.1
    position = 0, 44
    halign = center
    valign = center
}

# ─── CAT LINE 3: body/tail (bristles on fail) ────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash -c 'if [ $ATTEMPTS -gt 0 ]; then echo "  > # <"; else f=$(( ($(date +%s%3N) / 2000) % 6 )); case $f in 3) echo "  > w <" ;; *) echo "  > ^ <" ;; esac; fi'
    color = rgb(000000)
    font_size = 22
    font_family = $font
    font_weight = bold
    shadow_passes = 1
    shadow_size = 8
    shadow_color = rgba(00000030)
    shadow_boost = 1.1
    position = 0, 16
    halign = center
    valign = center
}

# ─── CAT THOUGHT BUBBLE (changes with time of day) ────────────────────────────
label {
    monitor =
    text = cmd[update:60000] bash -c 'h=$(date +%H); if [ "$h" -ge 5 ] && [ "$h" -lt 9 ]; then echo "  zzz... 5 more mins... zzz"; elif [ "$h" -ge 9 ] && [ "$h" -lt 12 ]; then echo "  nom nom breakfast time 🐟"; elif [ "$h" -ge 12 ] && [ "$h" -lt 14 ]; then echo "  nap szn has commenced 😴"; elif [ "$h" -ge 14 ] && [ "$h" -lt 18 ]; then echo "  *knocks your coffee off* ☕"; elif [ "$h" -ge 18 ] && [ "$h" -lt 21 ]; then echo "  zoomies hour approaching 🌙"; elif [ "$h" -ge 21 ]; then echo "  3am chaos loading... 🌑"; else echo "  the void stares back 🌑"; fi'
    color = rgb(383838)
    font_size = 12
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}

# ─── INPUT FIELD ──────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 3

    outer_color = rgb(000000)
    inner_color = rgba(ffffffcc)

    font_color = rgb(000000)
    font_family = $font
    placeholder_text = 

    dots_size = 0.24
    dots_spacing = 0.45
    dots_center = true

    fade_on_empty = false
    rounding = 0

    check_color = rgb(00c853)
    fail_color = rgb(ff006e)
    fail_text = 
    fail_transition = 200

    position = 0, -120
    halign = center
    valign = center
}
