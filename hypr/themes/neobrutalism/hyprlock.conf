# -----------------------------------------------------
# HYPRLOCK - NEO-BRUTALISM LIGHT THEME
# -----------------------------------------------------

background {
    monitor =
    path = ~/.config/hypr/themes/neobrutalism/wallpapers/neobrutalism_matrix.png
    blur_passes = 0
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    outer_color = rgb(000000)
    inner_color = rgb(ffffff)
    font_color = rgb(000000)
    fade_on_empty = false
    placeholder_text = <span foreground="##000000" font_weight="bold">PASSWORD...</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    rounding = 4
    shadow_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] echo "<span background='#ff006e' foreground='#ffffff' font_weight='bold'>  $TIME  </span>"
    color = rgb(000000)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span background='#00f5d4' foreground='#000000' font_weight='bold'>  $(date +'%A, %d %B %Y')  </span>"
    color = rgb(000000)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}
