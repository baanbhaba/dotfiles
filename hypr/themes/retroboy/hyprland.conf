# -----------------------------------------------------
# MONITORS
# -----------------------------------------------------
monitor=,preferred,auto,1

source = ~/.config/hypr/env.conf

# -----------------------------------------------------
# PROGRAMS & CONSTANTS
# -----------------------------------------------------
$terminal    = kitty
$fileManager = ~/.local/bin/file-manager
$editor      = ~/.local/bin/instant-editor
$menu        = rofi -show drun -theme ~/.config/rofi/config.rasi
$run         = rofi -show run -theme ~/.config/rofi/config.rasi
$powermenu   = ~/.config/rofi/powermenu.sh
$mainMod     = SUPER

# -----------------------------------------------------
# AUTOSTART
# -----------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = systemctl --user start hyprpolkitagent
exec-once = mako &
exec-once = ~/.local/bin/flac-notify &
exec-once = ~/.local/bin/flac-discord-rpc &
exec-once = waybar &
exec-once = hyprpaper &
exec-once = systemctl --user start swayosd.service
exec-once = ~/.config/hypr/scripts/workspace_osd.sh &
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = hypridle &
exec-once = ~/.config/hypr/scripts/battery_check.sh &

# -----------------------------------------------------
# INPUT & GESTURES
# -----------------------------------------------------
device {
    name = synps/2-synaptics-touchpad
    sensitivity = -0.1
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = -0.7

    touchpad {
        tap-to-click = true
        natural_scroll = true
    }
}

# -----------------------------------------------------
# GENERAL LAYOUT (RetroBoy: 4px GameBoy DMG Chunky Borders)
# -----------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 4
    col.active_border = rgb(8bac0f) rgb(306230) rgb(8bac0f) rgb(0f380f) 45deg
    col.inactive_border = rgb(0f380f)
    layout = dwindle
    allow_tearing = false
}

# -----------------------------------------------------
# DECORATION & EFFECTS (Zero Rounding & Hard 2D Shadow)
# -----------------------------------------------------
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.98

    shadow {
        enabled = true
        range = 0
        offset = 6, 6
        color = rgb(0f380f)
        render_power = 4
    }

    blur {
        enabled = false
    }
}

# -----------------------------------------------------
# ANIMATIONS (Snappy Retro Pixel Stepping)
# -----------------------------------------------------
animations {
    enabled = true

    # Custom Beziers - Crisp & Snappy
    bezier = snap, 0.0, 0.0, 0.2, 1.0
    bezier = pop, 0.1, 1.2, 0.1, 1.0
    bezier = linear, 0, 0, 1, 1

    # Windows (Fast 8-bit Pop-in)
    animation = windows, 1, 3, pop, popin 80%
    animation = windowsIn, 1, 3, pop, popin 80%
    animation = windowsOut, 1, 2, snap, popin 80%
    animation = windowsMove, 1, 3, snap

    # Dynamic Flowing Border Angle
    animation = border, 1, 2, default
    animation = borderangle, 1, 30, linear, loop

    # Layer Surfaces (Rofi, Waybar, Mako)
    animation = layers, 1, 2, pop, popin 80%
    animation = layersIn, 1, 2, pop, popin 80%
    animation = layersOut, 1, 2, snap, popin 80%

    # Fades
    animation = fade, 1, 2, snap
    animation = fadeIn, 1, 2, snap
    animation = fadeOut, 1, 2, snap
    animation = fadeSwitch, 1, 2, snap
    animation = fadeDim, 1, 2, snap

    # Workspaces (Crisp Slide)
    animation = workspaces, 1, 3, snap, slide
    animation = specialWorkspace, 1, 3, pop, slidevert
}

# -----------------------------------------------------
# WINDOW RULES (v0.55+ Syntax)
# -----------------------------------------------------
windowrule {
    name = system_popups
    match:class = ^(nm-connection-editor|org.pulseaudio.pavucontrol|blueman-manager|pavucontrol)$
    float = true
    pin = true
    size = 400 500
    move = cursor -200 -250
}

windowrule {
    name = file_manager_float
    match:class = ^(yazi-fm)$
    float = true
    size = 1050 680
    center = true
}

windowrule {
    name = instant_editor_float
    match:class = ^(instant-editor)$
    float = true
    size = 1100 720
    center = true
}

windowrule {
    name = quake_terminal_float
    match:class = ^(quake-terminal)$
    float = true
    size = 80% 55%
    move = 10% 40
}

windowrule {
    name = music_hud_float
    match:class = ^(music-hud)$
    float = true
    size = 960 540
    center = true
}

windowrule {
    name = flac_mini_float
    match:class = ^(flac-mini)$
    float = true
    size = 560 170
    center = true
}

windowrule {
    name = cava_float
    match:class = ^(cava-visualizer)$
    float = true
    size = 850 280
    center = true
}

windowrule {
    name = picture_in_picture_pin
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
    size = 640 360
    move = 1260 680
}

windowrule {
    name = mpv_float
    match:class = ^(mpv)$
    float = true
    center = true
}

windowrule {
    name = steam_games_fullscreen
    match:class = ^(steam_app_.*)$
    fullscreen = true
}

windowrule {
    name = space_weather_float
    match:class = ^(space-weather)$
    float = true
    size = 890 540
    center = true
}

# -----------------------------------------------------
# KEYBINDINGS - APPLICATIONS & ACTIONS
# -----------------------------------------------------
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, ~/.config/hypr/scripts/powermenu.sh
bind = $mainMod ALT, M, exec, ~/.local/bin/toggle-music-hud
bind = $mainMod CTRL, M, exec, ~/.local/bin/toggle-mini-player
bind = $mainMod SHIFT, M, exec, ~/.local/bin/rofi-flac
bind = $mainMod ALT, F, exec, ~/.local/bin/flac-fav toggle
bind = $mainMod ALT, N, exec, ~/.local/bin/flac-queue next
bind = $mainMod ALT, P, exec, ~/.local/bin/flac-queue prev
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, $editor
bind = $mainMod, N, exec, $editor
bind = $mainMod, I, exec, ~/.local/bin/rofi-wifi
bind = $mainMod, B, exec, ~/.local/bin/rofi-bluetooth
bind = $mainMod SHIFT, B, exec, ~/.local/bin/rofi-brightness
bind = $mainMod, GRAVE, exec, ~/.local/bin/toggle-scratchpad
bind = $mainMod SHIFT, A, exec, ~/.local/bin/toggle-cava
bind = $mainMod SHIFT, V, exec, ~/.local/bin/clipboard-menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen,
bind = $mainMod, ESCAPE, exec, $menu
bind = $mainMod, R, exec, $run
bind = $mainMod, Z, fullscreenstate, 0, 1
bind = $mainMod, X, exec, ~/.local/bin/toggle-invert

# -----------------------------------------------------
# KEYBINDINGS - WINDOW & WORKSPACE NAVIGATION
# -----------------------------------------------------
# Focus Navigation
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Window Movement
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspace Switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resize_window

# Hardware Controls
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioPlay,        exec, playerctl -p com.github.neithern.g4music,%any play-pause
bindl  = , XF86AudioPause,       exec, playerctl -p com.github.neithern.g4music,%any play-pause
bindl  = , XF86AudioNext,        exec, ~/.local/bin/flac-queue next
bindl  = , XF86AudioPrev,        exec, ~/.local/bin/flac-queue prev
bindl  = , XF86AudioStop,        exec, playerctl -p com.github.neithern.g4music,%any stop
bindl  = , XF86PowerOff,         exec, ~/.config/hypr/scripts/powermenu.sh
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Screenshots (Deluxe Interactive Engine)
bind = , Print, exec, ~/.local/bin/screenshot full
bind = $mainMod SHIFT, S, exec, ~/.local/bin/screenshot area
bind = ALT, Print, exec, ~/.local/bin/screenshot window
bind = $mainMod, Print, exec, ~/.local/bin/screenshot menu

# Misc Keybindings
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod CTRL, W, exec, wallpaper-manager
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/theme_switcher.sh
bind = $mainMod SHIFT, Z, exec, ~/.local/bin/zen
bind = $mainMod SHIFT, N, exec, ~/.local/bin/toggle-nightlight
bind = $mainMod ALT, K, exec, ~/.local/bin/thockd --toggle

# -----------------------------------------------------
# MISC, DEBUG & LAYOUT SETTINGS
# -----------------------------------------------------
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = 0x0f380f
    disable_splash_rendering = true
}

debug {
    vfr = true
}

dwindle {
    preserve_split = true
}
