# ╔══════════════════════════════════════════════════╗
# ║        HYPRLOCK - RETROBOY DMG + POP CAT         ║
# ║           🐱 8-bit dot-matrix energy 🐱          ║
# ╚══════════════════════════════════════════════════╝

$font = JetBrainsMono Nerd Font
$pixel = Silkscreen

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = snap,0.0,0.0,0.2,1.0
    bezier = linear,0,0,1,1

    animation = fadeIn,1,3,snap
    animation = fadeOut,1,2,linear
    animation = inputFieldDots,1,1,snap
}

# ─── BACKGROUND (DMG Dot-Matrix LCD Tint) ────────────────────────────────────
background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8
    noise = 0.03
    contrast = 1.15
    brightness = 0.85
    vibrancy = 0.4
    color = rgba(9bbc0fff)
}

# ─── TIME ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(0f380f)
    font_size = 84
    font_family = $pixel
    font_weight = 700
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(15,56,15,0.4)
    position = 0, 210
    halign = center
    valign = center
}

# ─── DATE (DMG Olive Accent) ──────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"  %A  ·  %d %B"
    color = rgb(306230)
    font_size = 14
    font_family = $pixel
    font_weight = 700
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(48,98,48,0.3)
    position = 0, 135
    halign = center
    valign = center
}

# ─── CAT LINE 1: ears ─────────────────────────────────────────────────────────
label {
    monitor =
    text =   /\_/\  
    color = rgb(0f380f)
    font_size = 22
    font_family = $font
    font_weight = bold
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(15,56,15,0.3)
    shadow_boost = 1.1
    position = 0, 72
    halign = center
    valign = center
}

# ─── CAT LINE 2: face (normal cycle / angry on fail) ─────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash -c 'if [ $ATTEMPTS -gt 0 ]; then f=$(( ($(date +%s%3N) / 2000) % 3 )); case $f in 0) echo " ( >:< )" ;; 1) echo " ( x_x )" ;; 2) echo " ( oo )" ;; esac; else f=$(( ($(date +%s%3N) / 2000) % 6 )); case $f in 0) echo " ( o.o )" ;; 1) echo " ( -.- )" ;; 2) echo " ( ^.^ )" ;; 3) echo " ( >w< )" ;; 4) echo " ( >.< )" ;; 5) echo " ( OwO )" ;; esac; fi'
    color = rgb(0f380f)
    font_size = 22
    font_family = $font
    font_weight = bold
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(15,56,15,0.3)
    shadow_boost = 1.1
    position = 0, 44
    halign = center
    valign = center
}

# ─── CAT LINE 3: body/tail (bristles on fail) ────────────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash -c 'if [ $ATTEMPTS -gt 0 ]; then echo "  > # <"; else f=$(( ($(date +%s%3N) / 2000) % 6 )); case $f in 3) echo "  > w <" ;; *) echo "  > ^ <" ;; esac; fi'
    color = rgb(0f380f)
    font_size = 22
    font_family = $font
    font_weight = bold
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(15,56,15,0.3)
    shadow_boost = 1.1
    position = 0, 16
    halign = center
    valign = center
}

# ─── CAT THOUGHT BUBBLE (changes with time of day) ────────────────────────────
label {
    monitor =
    text = cmd[update:60000] bash -c 'h=$(date +%H); if [ "$h" -ge 5 ] && [ "$h" -lt 9 ]; then echo "  zzz... 5 more mins... zzz"; elif [ "$h" -ge 9 ] && [ "$h" -lt 12 ]; then echo "  nom nom breakfast time 🐟"; elif [ "$h" -ge 12 ] && [ "$h" -lt 14 ]; then echo "  nap szn has commenced 😴"; elif [ "$h" -ge 14 ] && [ "$h" -lt 18 ]; then echo "  *knocks your coffee off* ☕"; elif [ "$h" -ge 18 ] && [ "$h" -lt 21 ]; then echo "  zoomies hour approaching 🌙"; elif [ "$h" -ge 21 ]; then echo "  3am chaos loading... 🌑"; else echo "  the void stares back 🌑"; fi'
    color = rgb(306230)
    font_size = 12
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}

# ─── INPUT FIELD (DMG Pixel Border & 0px Rounding) ───────────────────────────
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 4

    outer_color = rgb(0f380f)
    inner_color = rgb(8bac0f)

    font_color = rgb(0f380f)
    font_family = $pixel
    placeholder_text = 

    dots_size = 0.28
    dots_spacing = 0.40
    dots_center = true

    fade_on_empty = false
    rounding = 0

    check_color = rgb(9bbc0f)
    fail_color = rgb(306230)
    fail_text = 
    fail_transition = 150

    position = 0, -120
    halign = center
    valign = center
}
