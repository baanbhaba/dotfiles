# ─────────────────────────────
# Amber CRT / Cyber Terminal
# ─────────────────────────────

# Foreground / Background
foreground            #ffb000
background            #080808

selection_foreground  #080808
selection_background  #ffb000

font_size             14.0
background_opacity    0.82

# Cursor
cursor                #ffb000
cursor_shape          beam
cursor_blink_interval 0.6


# ─────────────────────────────
# ANSI Palette
# ─────────────────────────────

# Black / Dark tones
color0  #080808
color8  #3a3a3a

# Red
color1  #b83a00
color9  #ff5c00

# Green (muted amber-compatible)
color2  #8c9b32
color10 #b5c94a

# Yellow / Amber
color3  #ffb000
color11 #ffd166

# Blue (dark steel)
color4  #355c7d
color12 #5f87af

# Magenta
color5  #8f5f8f
color13 #c080c0

# Cyan
color6  #4f8f8f
color14 #8fd3d3

# White
color7  #b0b0b0
color15 #ffffff


# ─────────────────────────────
# Window Layout
# ─────────────────────────────

window_padding_width 12
confirm_os_window_close 0

# Remove external theme override
# include ~/.config/kitty/themes/charcoal.conf
