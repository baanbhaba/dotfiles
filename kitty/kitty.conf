# ─────────────────────────────────────────────────────────────
# KITTY MASTER CONFIG - DYNAMIC THEMED TERMINAL
# ─────────────────────────────────────────────────────────────

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Window Padding & Border
window_padding_width 14
window_border_width  2pt
confirm_os_window_close 0

# Tab Bar Aesthetic Design (Slanted Powerline Tabs)
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2
active_tab_font_style   bold-italic
inactive_tab_font_style normal

# Cursor & Smooth Motion Animation
cursor_shape                   beam
cursor_beam_thickness          2.0
cursor_blink_interval          0.5 ease-in-out
cursor_trail                   1
cursor_trail_decay             0.1 0.35
cursor_trail_start_threshold   1

# Dynamic Theme Inclusion (Switched by theme_switcher.sh)
include ~/.config/kitty/themes/retroboy.conf
