# -----------------------------------------------------
# KITTY THEME - NEO-BRUTALISM (LIGHT MODE)
# High Contrast, Electric Colors, Thick Borders
# -----------------------------------------------------

# Foreground/Background
foreground            #000000
background            #fffdf0
selection_foreground  #000000
selection_background  #ffbe0b
font_size 13.5
background_opacity 1.0

# Cursor (Hot Pink Block)
cursor                #ff006e
cursor_text_color     #ffffff
cursor_shape          block

# Standard Colors (Neo-Brutalist Palette)
# Black / Gray
color0  #000000
color8  #555555

# Red / Hot Pink
color1  #ff006e
color9  #ff3385

# Green / Lime
color2  #00f5d4
color10 #70e000

# Yellow / Cyber Yellow
color3  #ffbe0b
color11 #ffe600

# Blue / Electric Blue
color4  #3a86ff
color12 #61a0ff

# Magenta / Purple
color5  #8338ec
color13 #9d4edd

# Cyan / Teal
color6  #00bbf9
color14 #38b000

# White / Off-White
color7  #e5e5e5
color15 #ffffff

# Window Layout
window_padding_width 14
window_border_width 3pt
active_border_color #000000
inactive_border_color #555555
confirm_os_window_close 0
