# ─────────────────────────────────────────────
# KITTY THEME: RETROBOY (GAMEBOY DMG 4-SHADE)
# ─────────────────────────────────────────────

font_family           VT323
font_size             16.0

foreground            #9bbc0f
background            #0f380f
selection_foreground  #0f380f
selection_background  #8bac0f
background_opacity    1.0

cursor                #8bac0f
cursor_text_color     #0f380f
cursor_shape          block
cursor_blink_interval 0.5

# Tab Bar Colors
active_tab_foreground   #0f380f
active_tab_background   #8bac0f
inactive_tab_foreground #9bbc0f
inactive_tab_background #306230
tab_bar_background      #0f380f

# Active Window Borders
active_border_color   #8bac0f
inactive_border_color #306230

# ANSI Colors (GameBoy DMG Palette Harmony)
color0  #0f380f
color8  #306230
color1  #8bac0f
color9  #9bbc0f
color2  #8bac0f
color10 #9bbc0f
color3  #8bac0f
color11 #9bbc0f
color4  #306230
color12 #8bac0f
color5  #306230
color13 #9bbc0f
color6  #8bac0f
color14 #9bbc0f
color7  #8bac0f
